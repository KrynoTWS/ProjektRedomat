services:
  db:
    image: postgres:15
    container_name: redomat_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - redomat_data:/var/lib/postgresql/data

volumes:
  redomat_data:
